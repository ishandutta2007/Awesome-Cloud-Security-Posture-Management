<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="50%" stop-color="#161b22"/><stop offset="100%" stop-color="#0a0d12"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="50%" stop-color="#2563eb"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><linearGradient id="shieldGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(.98)}50%{opacity:.7;transform:scale(1.02)}}@keyframes scanline{0%{transform:translateY(-100px);opacity:0}50%{opacity:.4}}@keyframes floatParticle{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-15px) rotate(180deg)}}.badge-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:42px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#38bdf8}.pulse-bg{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.particle-1{animation:floatParticle 8s ease-in-out infinite}.particle-2{animation:floatParticle 12s ease-in-out infinite reverse}.scan-beam{animation:scanline 8s linear infinite}</style><rect width="1200" height="320" fill="url(#bgGlow)" rx="16"/><rect width="1196" height="316" x="2" y="2" fill=
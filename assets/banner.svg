<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Dynamic Animated Elements */
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    
    @keyframes scanline {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.4; }
      100% { transform: translateY(320px); opacity: 0; }
    }

    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }

    .pulse-bg { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .particle-1 { animation: floatParticle 8s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 12s ease-in-out infinite reverse; }
    .scan-beam { animation: scanline 8s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGlow)" />
  <rect width="1196" height="316" x="2" y="2" rx="14" fill="none" stroke="#30363d" stroke-width="2" />

  <!-- Dynamic Background Grid & Graphic Ornaments (Behind Text) -->
  <g opacity="0.15">
    <path d="M 0,80 L 1200,80 M 0,160 L 1200,160 M 0,240 L 1200,240" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4" />
    <path d="M 200,0 L 200,320 M 400,0 L 400,320 M 600,0 L 600,320 M 800,0 L 800,320 M 1000,0 L 1000,320" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="150" cy="160" r="180" fill="#7c3aed" opacity="0.15" filter="url(#glow)" class="pulse-bg" />
  <circle cx="1050" cy="100" r="150" fill="#2563eb" opacity="0.15" filter="url(#glow)" class="pulse-bg" />

  <!-- Animated Decorative Scanning Line (Underneath text foreground) -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#primaryGrad)" stroke-width="2" class="scan-beam" filter="url(#glow)" />

  <!-- Floating Tech Nodes / Floating Accent Particles (Positioned safely) -->
  <g class="particle-1" opacity="0.5">
    <circle cx="980" cy="70" r="4" fill="#38bdf8" />
    <circle cx="1060" cy="220" r="6" fill="#818cf8" />
    <line x1="980" y1="70" x2="1060" y2="220" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />
  </g>
  
  <g class="particle-2" opacity="0.4">
    <circle cx="120" cy="250" r="5" fill="#a78bfa" />
    <circle cx="70" cy="90" r="3" fill="#38bdf8" />
  </g>

  <!-- RIGHT SIDE EMBLEM: Cloud Security Shield Vector Graphic -->
  <g transform="translate(930, 75)" filter="url(#subtleGlow)">
    <!-- Shield Outline -->
    <path d="M 80 10 L 150 40 V 100 C 150 145 80 175 80 175 C 80 175 10 145 10 100 V 40 Z" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="4" />
    <!-- Inner Cloud Symbol inside Shield -->
    <path d="M 55 105 C 50 105 45 100 45 94 C 45 89 49 85 54 84 C 53 82 53 80 53 78 C 53 70 60 63 68 63 C 74 63 80 67 82 72 C 85 69 90 67 95 67 C 103 67 110 74 110 82 C 114 83 117 87 117 92 C 117 98 112 103 106 103 Z" fill="url(#primaryGrad)" />
    <!-- Checkmark inside Shield Cloud -->
    <path d="M 72 90 L 78 96 L 90 84" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND TEXT CONTENT (Guaranteed Clear & Readable) -->
  <g transform="translate(70, 0)">
    <!-- Top Category Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="280" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="140" y="20" text-anchor="middle" class="badge-text">🛡️ CLOUD SECURITY POSTURE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title">Awesome Cloud Security Posture Management</text>
    
    <!-- Gradient Accent Bar -->
    <rect x="0" y="148" width="680" height="4" rx="2" fill="url(#primaryGrad)" />

    <!-- Subtitle Description -->
    <text x="0" y="192" class="subtitle">A Curated Ecosystem of CSPM Platforms, CNAPP Tools,</text>
    <text x="0" y="222" class="subtitle">Open-Source Auditing &amp; Multi-Cloud Compliance Guardrails</text>

    <!-- Tech Stack Mini Badges at Bottom Left -->
    <g transform="translate(0, 252)">
      <rect width="80" height="24" rx="6" fill="#1e293b" />
      <text x="40" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">AWS</text>
      
      <rect x="90" width="80" height="24" rx="6" fill="#1e293b" />
      <text x="130" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">AZURE</text>
      
      <rect x="180" width="80" height="24" rx="6" fill="#1e293b" />
      <text x="220" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">GCP</text>

      <rect x="270" width="100" height="24" rx="6" fill="#1e293b" />
      <text x="320" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">KUBERNETES</text>

      <rect x="380" width="90" height="24" rx="6" fill="#1e293b" />
      <text x="425" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">TERRAFORM</text>
    </g>
  </g>
</svg>
